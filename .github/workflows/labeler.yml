name: Etiquetas por ruta

# Etiqueta los PRs según las carpetas que tocan (reglas en .github/labeler.yml).
# pull_request_target permite etiquetar PRs de forks; no se hace checkout del PR:
# la acción solo lee la lista de archivos cambiados y la configuración de main.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false
